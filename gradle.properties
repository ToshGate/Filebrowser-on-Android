org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# --- Identidade e versão da app ---------------------------------------------------------
# O applicationId é o identificador da app na Play Store e no telemóvel. Depois da primeira
# publicação NÃO pode mudar (seria outra app). Confirma-o antes de publicar.
APP_ID=com.toshgate.filebrowser

# versionName: o que o utilizador vê. versionCode: número inteiro que tem de subir em
# cada build enviado para a Play Store (1, 2, 3, ...).
APP_VERSION_NAME=1.0.0
APP_VERSION_CODE=1
